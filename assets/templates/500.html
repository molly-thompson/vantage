{% extends "base.html" %}

{% block title %}Error | Vantage{% endblock %}

{% block content %}
    <div class="flex min-h-[60vh] flex-col items-center justify-center text-center">
        <p class="text-sm font-medium uppercase tracking-widest text-muted-content">
            Error 500
        </p>

        <h1 class="mt-3 text-4xl font-bold">
            Internal server error
        </h1>

        <p class="mt-4 max-w-md text-muted-content">
            Something went wrong on our end while processing your request.
        </p>

        <a href="{% url 'core:home' %}" class="btn btn-primary mt-8">
            Return home
        </a>
    </div>
{% endblock %}
