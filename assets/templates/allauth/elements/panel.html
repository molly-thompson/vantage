{% load allauth %}
<section class="mt-6 space-y-4 border-t border-base-300 pt-6">
    <h2 class="text-lg font-semibold tracking-tight">
        {% slot title %}
        {% endslot %}
    </h2>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
        <ul class="space-y-2">
            {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
        </ul>
    {% endif %}
</section>
