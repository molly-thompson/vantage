name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: False
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DATABASE_URL: postgres://vantage:vantage@localhost:5432/vantage

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vantage
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: vantage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantage -d vantage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Tailwind CLI
        run: |
          curl -L https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o build_files/tailwindcss
          chmod +x build_files/tailwindcss
      
      - name: Build Tailwind CSS
        run: |
          ./build_files/tailwindcss \
          -i ./assets/static/css/input.css \
          -o ./assets/static/css/output.css

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check typing
        run: uv run mypy .

      - name: Run migrations
        run: uv run python manage.py migrate

      - name: Run tests
        run: uv run pytest
